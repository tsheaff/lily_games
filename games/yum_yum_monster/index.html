<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Yum Yum Monster</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👾</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #e6f7ff;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }
      .corner {
        position: fixed;
        top: 12px;
        width: 52px;
        height: 52px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.75);
        box-shadow: 0 6px 16px -8px rgba(80, 60, 90, 0.5);
        font-size: 26px;
        line-height: 52px;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        padding: 0;
        z-index: 2;
      }
      #home { left: 12px; }
      #mute { right: 12px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <a id="home" class="corner" href="../../" title="All games">🏠</a>
    <button id="mute" class="corner" title="Sound on/off">🔊</button>
    <script src="main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Lily's Rainbow Ocean</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div id="treasures"></div>
      <div id="rainbows"></div>
    </div>
    <button id="mute" class="corner" title="Sound on/off">🔊</button>
    <button id="dress" class="corner hidden" title="Dress up your sailor and pick a boat">👗</button>
    <div id="toast"></div>
    <div id="flash"></div>

    <div id="picker" class="hidden">
      <div class="panel">
        <h2 id="picker-title"></h2>
        <div id="picker-tabs"></div>
        <div id="picker-body"></div>
        <div class="picker-nav">
          <button id="picker-back" class="nav">◀ Closet</button>
          <button id="picker-random" class="nav">🎲 Surprise Me!</button>
          <button id="picker-next" class="big"></button>
        </div>
      </div>
    </div>
    <div id="spin-hint">👆 Drag to spin · tap to twirl</div>
    <div id="curtain"></div>

    <div id="start" class="overlay">
      <div class="card">
        <h1>Lily's<br /><span class="rainbow-text">Rainbow Ocean</span></h1>
        <p>Sail your boat to the islands.<br />Every island has a surprise treasure!</p>
        <button id="play" class="big">⛵ Let's Sail!</button>
        <p class="hint">Tap the water to sail there &nbsp;·&nbsp; or use the arrow keys<br />Sail through a 🌈 Double Rainbow if you can catch one!</p>
      </div>
    </div>

    <div id="win" class="overlay hidden">
      <div class="card">
        <h1>Hooray!</h1>
        <p>You found <span class="rainbow-text">ALL</span> the treasures!</p>
        <div id="win-treasures"></div>
        <button id="again" class="big">🌈 Play Again</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
